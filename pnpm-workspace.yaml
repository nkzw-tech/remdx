packages:
  - examples/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    react: '*'
    react-dom: '*'
    vite: '*'
